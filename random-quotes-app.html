<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quotes App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .quote-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease-in;
            transition: all 0.3s ease;
        }

        .quote-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .quote-text {
            font-size: 24px;
            font-weight: 300;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
            font-style: italic;
        }

        .quote-author {
            font-size: 16px;
            color: #667eea;
            text-align: right;
            font-weight: 600;
            padding-right: 20px;
        }

        .quote-author::before {
            content: "— ";
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-new-quote {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-new-quote:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-new-quote:active {
            transform: scale(0.98);
        }

        .btn-random-item {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-random-item:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .btn-random-item:active {
            transform: scale(0.98);
        }

        .random-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .item {
            padding: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 120px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
            animation: fadeIn 0.5s ease-in;
        }

        .item:hover {
            transform: scale(1.08);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            margin-bottom: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">✨ Quote Inspiration ✨</h1>
        <p class="subtitle">Get inspired with random wisdom</p>

        <div class="quote-card" id="quoteCard">
            <p class="quote-text" id="quoteText">Click a button to see a random quote!</p>
            <p class="quote-author" id="quoteAuthor">Unknown</p>
        </div>

        <div class="button-group">
            <button class="btn-new-quote" onclick="newQuote()">New Quote</button>
            <button class="btn-random-item" onclick="randomizeItems()">Random Items</button>
        </div>

        <div class="random-items" id="randomItems"></div>
    </div>

    <script>
        const quotes = [
            { text: "The greatest glory in living lies not in never falling, but in rising every time we fall.", author: "Nelson Mandela" },
            { text: "The way to get started is to quit talking and begin doing.", author: "Walt Disney" },
            { text: "Life is what happens when you're busy making other plans.", author: "John Lennon" },
            { text: "The purpose of our lives is to be happy.", author: "Dalai Lama" },
            { text: "Success is not the key to happiness. Happiness is the key to success.", author: "Albert Schweitzer" },
            { text: "Get busy living or get busy dying.", author: "Stephen King" },
            { text: "You have within you right now, everything you need to deal with whatever the world can throw at you.", author: "Brian Tracy" },
            { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
            { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
            { text: "It is during our darkest moments that we must focus to see the light.", author: "Aristotle" }
        ];

        const colors = [
            "linear-gradient(135deg, #667eea 0%, #764ba2 100%)",
            "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)",
            "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)",
            "linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)",
            "linear-gradient(135deg, #fa709a 0%, #fee140 100%)",
            "linear-gradient(135deg, #30cfd0 0%, #330867 100%)",
            "linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)",
            "linear-gradient(135deg, #ff9a56 0%, #ff6a88 100%)"
        ];

        const items = ["💡", "🌟", "🚀", "❤️", "🎯", "🏆", "✨", "🌈"]; 

        function newQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const quote = quotes[randomIndex];
            document.getElementById("quoteText").innerText = `"${quote.text}"`;
            document.getElementById("quoteAuthor").innerText = quote.author;
        }

        function randomizeItems() {
            const itemsContainer = document.getElementById("randomItems");
            itemsContainer.innerHTML = "";

            for (let i = 0; i < 6; i++) {
                const item = document.createElement("div");
                item.className = "item";
                item.innerText = items[Math.floor(Math.random() * items.length)];
                item.style.background = colors[Math.floor(Math.random() * colors.length)];
                itemsContainer.appendChild(item);
            }
        }

        // Initialize on page load
        window.onload = function() {
            newQuote();
            randomizeItems();
        };
    </script>
</body>
</html>
