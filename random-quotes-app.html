<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { 
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .quote-container {
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            text-align: center;
        }
        .quote {
            font-size: 24px;
            font-style: italic;
            margin: 20px 0;
        }
        .author {
            font-size: 18px;
            color: #555;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
    <title>Random Quotes App</title>
</head>
<body>
    <div class="quote-container">
        <div class="quote" id="quote">Loading...</div>
        <div class="author" id="author">Author</div>
        <button id="new-quote">New Quote</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
